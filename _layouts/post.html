---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <div class="post-meta">{{ page.date | date: "%Y 年 %m 月 %d 日" }}{% if page.categories %} · {{ page.categories | first }}{% endif %}</div>
  <div class="post-body">
{{ content }}
  </div>
  <nav class="post-nav">
    {% if page.previous.url %}<a href="{{ page.previous.url | relative_url }}">← {{ page.previous.title }}</a>{% endif %}
    {% if page.next.url %}<a class="next" href="{{ page.next.url | relative_url }}">{{ page.next.title }} →</a>{% endif %}
  </nav>
  <section class="comments">
    <h2>💬 评论</h2>
    <script src="https://giscus.app/client.js"
      data-repo="你的用户名/你的仓库名"
      data-repo-id="填写启用后得到的ID"
      data-category="Announcements"
      data-category-id="填写启用后得到的ID"
      data-mapping="pathname"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="bottom"
      data-theme="preferred_color_scheme"
      data-lang="zh-CN"
      crossorigin="anonymous"
      async>
    </script>
  </section>
</article>
