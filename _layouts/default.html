<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title and page.title != "首页" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="author" content="{{ site.author }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="{{ '/' | relative_url }}" class="logo">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/about' | relative_url }}">关于</a>
    </nav>
  </div>
</header>

<main class="wrap main">
{{ content }}
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>© {{ site.time | date: "%Y" }} {{ site.author }}</span>
    <span class="sig">写下来，就不容易忘。</span>
  </div>
</footer>

</body>
</html>
